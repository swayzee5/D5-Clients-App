name: Build Android AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'resources/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # android/ n'est pas versionné, au même titre que ios/ : il est régénéré
      # ici. Le wrapper Gradle vient du template Capacitor, plus besoin
      # d'installer Gradle à la main.
      - name: Add Android platform
        run: |
          if [ ! -d "android" ] || [ -z "$(ls -A android 2>/dev/null)" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # Sans ce fichier, le plugin google-services ne s'applique pas et les
      # notifications ne fonctionnent pas — le build réussirait quand même,
      # silencieusement. On échoue donc explicitement.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON absent. Sans lui, l'app se construit mais ne peut recevoir aucune notification."
            exit 1
          fi
          # Le secret est accepté tel quel (JSON collé directement) ou en base64,
          # pour ne pas imposer un encodage de plus. Ce fichier n'est pas un
          # secret au sens strict — il est embarqué dans l'APK et lisible par
          # quiconque le décompresse — mais il reste hors du dépôt.
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if ! node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
              || { echo "::error::GOOGLE_SERVICES_JSON n'est ni du JSON valide ni du base64 valide"; exit 1; }
          fi
          node -e "
            const j = JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'));
            const names = (j.client || []).map(c => c.client_info.android_client_info.package_name);
            if (!names.includes('com.d5coaching.clients')) {
              console.error('::error::google-services.json ne contient pas com.d5coaching.clients (trouvé : ' + names.join(', ') + ')');
              process.exit(1);
            }
          "
          echo "google-services.json en place et cohérent avec l'applicationId"

      # Le Play Store exige que chaque mise à jour soit signée avec la clé de la
      # version publiée. L'ancien workflow en générait une nouvelle quand le
      # secret manquait : cela produisait un AAB que le Play Store aurait refusé,
      # sans que rien ne l'annonce. On s'arrête plutôt.
      - name: Setup signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent. Signer avec une autre clé rendrait la mise à jour impossible pour les utilisateurs existants."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          echo "keystore en place"

      - name: Configure Android project
        env:
          # Monotone et déjà bien au-dessus du versionCode 7 de l'ancienne app.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          pip install --quiet pillow
          python3 scripts/configure-android.py

      - name: Build Signed Release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: D5Coaching-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
