name: Build Android AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'resources/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # capacitor.config.ts déclare webDir: 'out', qui n'existe pas — l'app
      # charge tout depuis Vercel via server.url et n'embarque aucun contenu
      # web. Capacitor tolère l'absence de contenu, mais pas celle du dossier :
      # il renonce à la copie, donc ne crée jamais android/app/src/main/assets,
      # puis échoue en tentant d'y écrire capacitor.config.json.
      - name: Create placeholder web directory
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>D5 Coaching</title>' \
            '<!-- Jamais affiche : server.url pointe sur le site. -->' \
            > out/index.html

      # android/ n'est pas versionné, au même titre que ios/ : il est régénéré
      # ici. Le wrapper Gradle vient du template Capacitor, plus besoin
      # d'installer Gradle à la main.
      - name: Add Android platform
        run: |
          if [ ! -d "android" ] || [ -z "$(ls -A android 2>/dev/null)" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # Sans ce fichier, le plugin google-services ne s'applique pas et les
      # notifications ne fonctionnent pas — le build réussirait quand même,
      # silencieusement. On échoue donc explicitement.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # Volontairement sans `set -e` : chaque échec est rattrapé pour produire
        # un message utile. Une version précédente s'arrêtait sur « base64:
        # invalid input » avant d'avoir pu expliquer quoi que ce soit.
        run: |
          set -uo pipefail
          TARGET=android/app/google-services.json

          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON absent. Sans lui, l'app se construit mais ne peut recevoir aucune notification."
            exit 1
          fi

          valid() { node -e "JSON.parse(require('fs').readFileSync('$TARGET','utf8'))" 2>/dev/null; }

          # Accepté tel quel (JSON collé directement) ou en base64, pour ne pas
          # imposer un encodage de plus. Ce fichier n'est pas un secret au sens
          # strict — il est embarqué dans l'APK — mais il reste hors du dépôt.
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$TARGET"
          if ! valid; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$TARGET" 2>/dev/null || true
          fi

          if ! valid; then
            # Décrit ce qui a été reçu sans jamais l'afficher.
            LEN=$(printf '%s' "$GOOGLE_SERVICES_JSON" | wc -c | tr -d ' ')
            FIRST=$(printf '%s' "$GOOGLE_SERVICES_JSON" | head -c 1)
            LINES=$(printf '%s' "$GOOGLE_SERVICES_JSON" | wc -l | tr -d ' ')
            echo "::error::GOOGLE_SERVICES_JSON n'est ni du JSON valide ni du base64 valide."
            echo "Reçu : ${LEN} octets, ${LINES} sauts de ligne, premier caractère « ${FIRST} »."
            # L'erreur de l'analyseur donne la position exacte du caractère
            # fautif — décisif quand le fichier a la bonne tête mais contient un
            # guillemet typographique ou un caractère invisible.
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$TARGET"
            echo "Erreur d'analyse :"
            node -e "try { JSON.parse(require('fs').readFileSync('$TARGET','utf8')) } catch (e) { console.log('  ' + e.message) }"
            echo "Octets non-ASCII trouvés (guillemets typographiques, espaces insécables…) :"
            grep -nP '[^\x00-\x7F]' "$TARGET" | head -5 | cut -c1-120 || echo "  aucun"
            echo "Attendu : le contenu du fichier google-services.json téléchargé depuis Firebase,"
            echo "qui commence par « { » et fait quelques milliers d'octets."
            echo "Si le premier caractère est « / » ou « ~ », c'est un chemin de fichier qui a été collé, pas son contenu."
            exit 1
          fi

          node -e "
            const j = JSON.parse(require('fs').readFileSync('$TARGET','utf8'));
            const names = (j.client || []).map(c => c.client_info.android_client_info.package_name);
            if (!names.includes('com.d5coaching.clients')) {
              console.error('::error::google-services.json ne declare pas com.d5coaching.clients (trouve : ' + names.join(', ') + ')');
              process.exit(1);
            }
          " || exit 1
          echo "google-services.json en place et cohérent avec l'applicationId"

      # Le Play Store exige que chaque mise à jour soit signée avec la clé de la
      # version publiée. L'ancien workflow en générait une nouvelle quand le
      # secret manquait : cela produisait un AAB que le Play Store aurait refusé,
      # sans que rien ne l'annonce. On s'arrête plutôt.
      - name: Setup signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent. Signer avec une autre clé rendrait la mise à jour impossible pour les utilisateurs existants."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          echo "keystore en place"

      - name: Configure Android project
        env:
          # Monotone et déjà bien au-dessus du versionCode 7 de l'ancienne app.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          pip install --quiet pillow
          python3 scripts/configure-android.py

      - name: Build Signed Release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: D5Coaching-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
